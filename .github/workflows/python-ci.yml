# root/.github/workflows/python-ci.yml
name: Python CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources without importing optional GUI dependencies
        run: python -m compileall -q .
      - name: Run standard-library unit tests, if present
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -p 'test*.py' -v
          else
            echo 'No tests directory; syntax-only check completed.'
          fi
